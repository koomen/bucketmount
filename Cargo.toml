[package]
name = "bucketmount"
version = "0.1.0"
edition = "2021"
description = "Mount S3 buckets as macOS volumes, kept alive and monitored from the menu bar"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "7"
libc = "0.2"
ureq = { version = "2", features = ["json"] }
sha1_smol = "1.0.1"
time = { version = "0.3", features = ["formatting", "parsing"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
